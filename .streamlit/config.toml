[theme]
base = "light"
primaryColor = "#477568"
backgroundColor = "#fbfaf7"
secondaryBackgroundColor = "#f1f5f2"
textColor = "#20333a"
linkColor = "#c56b52"
borderColor = "#dfe7e4"
baseRadius = "small"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["38px", "28px", "22px", "18px", "15px", "13px"]
headingFontWeights = [700, 650, 650, 600, 500, 500]

[server]
fileWatcherType = "none"